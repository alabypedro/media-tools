[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-tools"
version = "1.0.0"
description = "Baixa vídeos, áudios, imagens e posts a partir de uma URL, e converte arquivos de vídeo, áudio, imagem, PDF e documentos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "yt-dlp[default]>=2025.11.12",
    "gallery-dl>=1.30",
    "pydantic>=2.7",
    "requests>=2.31",
    "imageio-ffmpeg>=0.5",
    "Pillow>=10.0",
    "pymupdf>=1.24",
    "pypdf>=6.0",
    "reportlab>=4.0",
    "markdown>=3.6",
    "py7zr>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pyinstaller>=6.10"]
heic = ["pillow-heif>=0.18"]

[project.scripts]
umd = "umd.cli:main"

[project.gui-scripts]
universal-media-tools = "umd.main:main"

[tool.setuptools.packages.find]
include = ["umd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: acessa a internet de verdade (rode com: pytest --run-network)",
]
qt_api = "pyside6"
